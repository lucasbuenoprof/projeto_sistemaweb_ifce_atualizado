<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGEH - Login</title>

    <!-- 1. BOOTSTRAP 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 2. Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- 3. Seu CSS personalizado -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- CABEÇALHO / NAVBAR BOOTSTRAP -->
<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm py-2" >
        <div class="container">
            
            <!-- Marca / Logo do Sistema -->
            <a class="navbar-brand fw-bold d-flex align-items-center" href="sigeh_home.html">
                <img id="img-login" src="../imagens/logo_sigehsf.png" alt="Logo SIGEH" class="img-fluid small me-2" style="max-height: 40px;"> 
                <h4 class="fw-bold mb-0 text-white">SIGEH</h4>
            </a>

            <!-- Links de Navegação do Menu -->
            <div class="collapse navbar-collapse" id="menuNavegacao">
                
                <!-- Links do lado esquerdo -->
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
                    <li class="nav-item">
                        <a class="nav-link active" href="sigeh_home.html">
                            <i class="fa-solid fa-house me-1"></i> Início
                        </a>
                    </li>
                </ul>

                <!-- Área de perfil / Sair do lado direito -->
                <div class="d-flex align-items-center text-white mt-2 mt-lg-0">
                    <span class="me-3 small">
                        <i class="fa-solid fa-circle-user me-1"></i> Olá, <strong>Usuário</strong>
                    </span>
                    <a href="sigeh_home.html" class="btn btn-outline-light btn-sm rounded-pill">
                        <i class="fa-solid fa-right-from-bracket me-1"></i> Voltar
                    </a>
                </div>

            </div>
        </div>
    </nav>
</header>

        <main>

            <h1>Cadastro de Pacientes</h1>
            <!-- (Mudar para POST) -->
            <form action="sigeh_home.html" method="get">
                
                <fieldset>
                    <legend><strong>Dados Pessoais</strong></legend>
                        <div class="campo">
                            <label for="nome">Nome do paciente:</label>
                            <input type="text" id="nome" name="nome" required> 
                        </div>    
                        <div class="campo">
                        <label for="sexo">Gênero:</label>
                            <select  id="sexo" name="sexo">
                                <option value="M">Masculino</option>
                                <option value="F">Feminino</option>
                                <option value="O">Outro</option>
                            </select>    
                        </div>
                        <div class="campo">       
                            <label for="data_nascimento">Data de Nascimento:</label>
                            <input type="date" id="data_nascimento" name="data_nascimento">
                        </div>
                        <div class="campo">
                            <label for="num_sus">Cadastro SUS:</label>
                            <input type="text" id="num_sus" name="num_sus">
                        </div>
                        <div class="campo">
                            <label for="num_cpf">CPF:</label>
                            <input type="text" id="num_cpf" name="num_cpf">
                        </div>
                        <div class="campo">
                            <label for="num_telefone">Contato:</label>
                            <input type="text" id="num_telefone" name="num_telefone">
                        </div>
                        <div class="campo">
                            <label for="email">E-mail:</label>
                            <input type="text" id="email" name="email">
                        </div>
                </fieldset>

                <fieldset>
                    <legend><strong>Dados de Endereço</strong></legend>
                        <div class="campo">
                            <label for="cep">CEP:</label>
                            <input type="text" id="cep" name="cep">
                        </div>    
                        <div class="campo">
                            <label for="endereco">Logradouro:</label>
                            <input type="text" id="endereco" name="endereco">
                        </div>
                        <div class="campo">
                            <label for="num_endereco">Nº:</label>
                            <input type="text" id="num_endereco" name="num_endereco"> 
                        </div>
                        <div class="campo">
                            <label for="bairro">Bairro:</label>
                            <input type="text" id="bairro" name="bairro">
                        </div> 
                        <div class="campo">
                            <label for="complemento">Complemento:</label>
                            <input type="text" id="complemento" name="complemento">
                        </div>
                        <div class="campo">
                            <label for="cidade">Cidade:</label>
                            <input type="text" id="cidade" name="cidade">
                        </div> 
                        <div class="campo">
                            <label for="uf">Estado:</label>
                            <input type="text" id="uf" name="uf">
                        </div> 
                        <div class="campo">
                            <label for="nacionalidade">Nacionalidade:</label>
                            <input type="text" id="nacionalidade" name="nacionalidade">
                        </div>
                </fieldset>       
                    
                    <button class="but" id="but-salvar" type="submit">Salvar</button>
                    <button class="but" id="but-reset" type="reset">Reiniciar</button>
                                   
            </form>     

        </main>
        <hr class="border-secondary mt-3 opacity-50">
        <footer id="rodape" class="text-center text-secondary p-auto m-auto  small bg-transparent">
            LB_Solutions™ - 2026
        </footer>

    </body>
</html>
