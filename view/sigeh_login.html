<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGEH - Login</title>

    <!-- 1. BOOTSTRAP 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 2. Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- 3. Seu CSS personalizado -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<!-- O body vira um container flexível vertical de 100vh -->
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- O main ocupa todo o espaço restante e centraliza o cartão -->
    <main class="container d-flex flex-grow-1 align-items-center justify-content-center py-4">
        
        <div class="row w-100 justify-content-center">
            <div class="col-md-5 col-lg-4">
                
                <!-- CARTÃO DO BOOTSTRAP -->
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-4 text-center">
                        
                        <!-- Logo & Título -->
                        <img id="img-login" src="../imagens/logo_sigehsf.png" alt="Logo SIGEH" class="img-fluid mb-3" style="max-height: 70px;">
                        
                        <h4 class="fw-bold text-primary mb-2">
                            <i class="fa-solid fa-hospital"></i> SIGEH
                        </h4>
                        
                        <p class="text-muted small mb-4">
                            <i class="fa-solid fa-user-lock"></i> Acesse seu Usuário
                        </p>

                        <!-- FORMULÁRIO -->
                        <form action="sigeh_home.html" method="GET">
                            
                            <!-- Campo Usuário -->
                            <div class="mb-3 text-start">
                                <label for="usuario" class="form-label fw-bold">Usuário:</label>
                                <input type="text" class="form-control" id="usuario" name="usuario" placeholder="Digite seu usuário" >
                            </div>

                            <!-- Campo Senha -->
                            <div class="mb-3 text-start">
                                <label for="senha" class="form-label fw-bold">Senha:</label>
                                <input type="password" class="form-control" id="senha" name="senha" placeholder="Digite sua senha">        
                            </div>    

                            <!-- Botão de Acesso -->
                            <div class="d-grid gap-2 mt-4">
                                <button class="btn btn-primary btn-lg rounded-3 fw-bold" type="submit">
                                    <i class="fa-solid fa-key me-1"></i> Acessar 
                                </button>
                            </div>

                            <!-- Link Esqueceu a Senha -->
                            <div class="mt-3">
                                <a href="#" class="text-decoration-none small text-secondary">
                                    Esqueceu sua senha?
                                </a>
                            </div>

                        </form>

                    </div>
                </div> <!-- Fim do Card -->

            </div>
        </div>

    </main>

    <!-- RODAPÉ PERFEITAMENTE POSICIONADO NO FUNDO -->
    <footer id="rodape" class="text-center text-secondary py-3 small bg-transparent">
        LB_Solutions™ - 2026
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
