<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGEH - Login</title>
    <!-- Vinculação da folha de estilo CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <!-- Ícones do Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <header class="cabeçalho">
        <h2><i class="fa-solid fa-hospital"></i> SIGEH - Sistema de Gestão Hospitalar</h2>
    </header>

  
    <main class="login-container">
        
        
        <img class="img-login" src="../imagens/logo_sigehsf.png" alt="Logo SIGEH" class="logo-login">

        <h3><i class="fa-solid fa-user-lock"></i> Acesse seu Usuário</h3>

        <form action="sigeh_home.html" method="GET">
            
            
            <div class="campo-log">
                <label for="usuario">
                    Usuário:
                </label>
                <input type="text" id="usuario" name="usuario">
            </div>
            <div class="campo-log">
                Senha:
                </label>
                <input type="password" id="senha" name="senha">        
            </div>

            <button class="but" id="but-acessar" type="submit"><i class="fa-solid fa-key"></i> Acessar </button>

            <p class="link-auxiliar">
                <a href="#">Esqueceu sua senha?</a>
            </p>

        </form>
        
    </main>

    <footer class="rodape">
        LB_Solutions™ - 2026
    </footer>

</body>
</html>
